name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run homepage tests
        run: npx playwright test tests/01/homepage.spec.ts --project=chromium --workers=1

      - name: Run dates tests
        run: npx playwright test tests/01/dates.spec.ts --project=chromium --workers=1

      - name: Run route tests
        run: npx playwright test tests/01/route.spec.ts --project=chromium --workers=1

      - name: Run travel class tests
        run: npx playwright test tests/01/travel-class.spec.ts --project=chromium --workers=1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30